[package]
name = "heidi-jwt"
version = "0.1.2"
edition = "2024"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
josekit = { git = "https://github.com/heidiverse/josekit-rs.git", default-features = false, features = [
    "rustcrypto",
    "pqc",
    "kapun-provider"
] }
base64 = "0.22.1"
tracing = "^0.1"
itertools = "0.14.0"
chrono = "0.4"
kapun-x509 = { git = "https://github.com/KapunSDK/kapun-sdk.git", default-features = false }
[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
# Pedantic
pedantic = "warn"
too_many_lines = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }


[package]
name = "heidi-jwt"
version = "0.1.2"
edition = "2024"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
josekit = { git = "https://github.com/heidiverse/josekit-rs.git", default-features = false, features = [
    "rustcrypto",
] }
base64 = "0.22.1"
tracing = "^0.1"
itertools = "0.14.0"
chrono = "0.4"
heidi-x509 = { git = "https://github.com/heidiverse/heidi-x509.git" }
[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
